# =============================================================================
# SWARM CONFIGURATION -- who the agents are, which model each uses, how much they
# may spend, and how a cycle is shaped.  Edit freely between cycles.
# =============================================================================
models:
  reasoning: claude-fable-5-2      # proposers, skeptics, moderators, post-mortems, seminars, synthesis
  implementer: claude-fable-5-2    # writes and reviews algorithm code (a wrong implementation kills a good idea)
  routine: claude-sonnet-5-5       # classification, seminar minutes
  clerical: claude-haiku-5-5       # digests and other reporting

# Which model tier and effort each kind of call uses. max_tokens includes the model's
# thinking: a reply cut off at the limit is paid for and then repeated (the trial of
# 2026-11-15 lost about 20 USD that way with limits of 32000 / 12000).
roles:
  literature:      {model: reasoning,   effort: high,   max_tokens: 32000}
  reproduce:       {model: reasoning,   effort: high,   max_tokens: 64000}
  propose:         {model: reasoning,   effort: high,   max_tokens: 64000}
  critique:        {model: reasoning,   effort: medium, max_tokens: 12000}
  revise:          {model: reasoning,   effort: high,   max_tokens: 64000}
  moderate:        {model: reasoning,   effort: high,   max_tokens: 32000}
  postmortem:      {model: reasoning,   effort: high,   max_tokens: 32000}
  seminar:         {model: reasoning,   effort: medium, max_tokens: 8000}
  crosspollinate:  {model: reasoning,   effort: high,   max_tokens: 32000}
  implement:       {model: implementer, effort: high,   max_tokens: 64000}
  review:          {model: implementer, effort: high,   max_tokens: 32000}
  numerics:        {model: implementer, effort: high,   max_tokens: 32000}   # numerical analyst (skeptic of the code)
  performance:     {model: implementer, effort: high,   max_tokens: 32000}   # performance engineer (CPU time)
  classify:        {model: routine,     effort: low,    max_tokens: 4000}
  minutes:         {model: routine,     effort: medium, max_tokens: 8000}
  digest:          {model: clerical,    effort: medium, max_tokens: 8000}

api:
  use_batches: true          # single-shot phases go through the Message Batches API (half price, slower)
  batch_poll_seconds: 60
  batch_max_wait_hours: 26
  max_concurrency: 6         # parallel live requests / parallel implementer agents
  agent_cache_ttl: 1h        # prompt-cache lifetime for tool-using agents (implementers, librarian):
                             # 1h or 5m. The trial lost 54 USD to 5-minute expiries during test runs.
  refusal_fallbacks: true    # server-side fallback model if a request is declined
  max_retries: 6

# USD per million tokens, used only for the local spending ledger.  Checked against
# https://platform.claude.com/docs/en/about-claude/pricing on 2026-11-15; check again later.
pricing:
  claude-fable-5-2:  {input: 8.0, output: 40.0, cache_read: 0.2,  cache_write: 10.0,  cache_write_1h: 16.0}
  claude-opus-5-5:   {input: 4.0, output: 20.0, cache_read: 0.2,  cache_write: 5.0,   cache_write_1h: 8.0}
  claude-sonnet-5-5: {input: 2.0, output: 10.0, cache_read: 0.1,  cache_write: 2.5,   cache_write_1h: 4.0}
  claude-haiku-5-5:  {input: 0.1, output: 0.5,  cache_read: 0.01, cache_write: 0.125, cache_write_1h: 0.2}
  web_search_per_1000: 10.0   # USD per 1000 web searches (the librarian)

# Limits for THIS swarm. Three independent swarms share 200 000 USD over six months, so
# each gets a third: 3 x 66 000 = 198 000. See RUNBOOK section 11.
budget:                      # the orchestrator stops cleanly when any limit is reached
  usd_per_cycle: 1200        # a normal cycle is expected near 400; cycle 1 near 620
  usd_per_month: 11000       # reached -> pauses until the next calendar month
  usd_total: 66000

cycle:
  # Loop mode: when does the next cycle start?  Decided by tickets and clocks only.
  wait_for_results: all          # all    = every queued evaluation, including promoted full/sealed runs
                                 # screen = as soon as every screen run is back (faster; later stages
                                 #          are read in whichever cycle they arrive)
                                 # none   = clock only
  min_days_between_cycles: 0     # never start sooner than this after the previous cycle
  max_days_waiting: 10           # start anyway after this long (lost jobs, a stuck queue)
  settle_minutes: 45             # 'all' only: quiet time after the last result, so the submit script
                                 # can queue promotions. Keep it longer than your cron interval.
  poll_minutes: 15
  proposals_per_slot: 1
  debate_rounds: 5               # skeptic-review -> proposer-revision rounds before a spec is final.
                                 # A proposal leaves the debate early once all its reviewers say
                                 # SETTLED. Read each new cycle from this file; see
                                 # workspace/proposals/cNNN/DEBATE_SUMMARY.md for whether late rounds help.
  select_per_cycle: 12           # ideas handed to implementers per cycle (of 24 proposals: real selection)
  wildcard_slots: 3              # of those, reserved for novel ideas in untried families
  max_family_share: 0.3          # no family may take more than this share of a cycle's selections
  redirect_share: 0.34           # a family above this share of recent proposals triggers redirects
  redirect_window_cycles: 3
  independence_cycles: 4         # cycles during which NO proposer sees other families' results
  informed_fraction: 0.25        # afterwards, share of proposer slots shown the cross-family picture
  seminar_topics: 2
  seminar_panel: 4
  crosspollinate_every: 3        # cycles (only after the independence period)
  literature_refresh_every: 6    # cycles
  implement_max_turns: 70        # tool turns for the first implementation pass (trial: one of four hit 45)
  implement_fix_rounds: 4        # review -> fix rounds; each fix pass gets half the turns above
  numerics_review: true          # a numerical analyst reviews the code in every round, next to the code reviewer
  performance_review: true       # once the code passes, a performance engineer is consulted; if it asks for
                                 # changes the implementer makes one optimisation pass and the code is reviewed
                                 # again (if that review fails, the reviewed un-optimised code is used)
  max_postmortems_per_cycle: 16
  submit_command: ""             # e.g. "bin/submit_eval.sh" if this host has sbatch, or an ssh command

# The proposer panel. (Once config/local_swarm.yaml has a proposer_slots list -- written by
# `bin/swarm.sh move` -- that list is used instead. RUNBOOK section 3.6.)
# persona = specialist role, knowledge = which slice of the
# literature library the agent is given (none = first principles only),
# view = the data product it is asked to think from first.
proposer_slots:
  - {id: P01, persona: solar_physicist,        knowledge: full, view: spectra}
  - {id: P02, persona: solar_physicist,        knowledge: none, view: ccf_and_indices}
  - {id: P03, persona: stellar_atmospheres,    knowledge: A,    view: spectra}
  - {id: P04, persona: stellar_atmospheres,    knowledge: none, view: spectra}
  - {id: P05, persona: instrumentalist,        knowledge: B,    view: telemetry_and_spectra}
  - {id: P06, persona: exoplanet_rv,           knowledge: full, view: time_series}
  - {id: P07, persona: exoplanet_rv,           knowledge: none, view: ccf_and_indices}
  - {id: P08, persona: highres_spectroscopist, knowledge: A,    view: spectra}
  - {id: P09, persona: highres_spectroscopist, knowledge: B,    view: ccf_and_indices}
  - {id: P10, persona: ml_researcher,          knowledge: B,    view: spectra}
  - {id: P11, persona: signal_outsider,        knowledge: none, view: any}
  - {id: P12, persona: bayesian_statistician,  knowledge: A,    view: time_series}
  # second dozen: every persona appears three times, each time with a different
  # literature slice and starting view
  - {id: P13, persona: solar_physicist,        knowledge: A,    view: time_series}
  - {id: P14, persona: stellar_atmospheres,    knowledge: B,    view: ccf_and_indices}
  - {id: P15, persona: instrumentalist,        knowledge: none, view: telemetry_and_spectra}
  - {id: P16, persona: instrumentalist,        knowledge: full, view: ccf_and_indices}
  - {id: P17, persona: exoplanet_rv,           knowledge: A,    view: spectra}
  - {id: P18, persona: highres_spectroscopist, knowledge: none, view: spectra}
  - {id: P19, persona: ml_researcher,          knowledge: none, view: ccf_and_indices}
  - {id: P20, persona: ml_researcher,          knowledge: full, view: time_series}
  - {id: P21, persona: signal_outsider,        knowledge: none, view: spectra}
  - {id: P22, persona: signal_outsider,        knowledge: B,    view: time_series}
  - {id: P23, persona: bayesian_statistician,  knowledge: none, view: ccf_and_indices}
  - {id: P24, persona: bayesian_statistician,  knowledge: full, view: spectra}

# What THIS swarm works on. Empty = unrestricted. Set it per swarm in config/local_swarm.yaml,
# for example to run one fast swarm on the compact data products and one slow swarm on the
# full spectra (RUNBOOK section 3.6). The note is shown to proposers and moderators;
# allowed_uses is enforced: a proposal whose `uses` front matter lists anything else is not
# selected (reference reproductions and human priority requests are exempt).
scope:
  note: ""
  allowed_uses: []           # from: spectra, ccf, order_rv, indices, telemetry, time

skeptics: [skeptic_statistics, skeptic_physics, skeptic_instrument]
moderators: 2

# Published methods reproduced as reference points in the first cycle (in addition
# to the three hand-written baselines shipped with the harness).
bootstrap_reproductions:
  - "SCALPELS (Collier Cameron et al. 2021): time-domain projection of RVs onto CCF autocorrelation shape components"
  - "FIESTA / phi-ESTA (Zhao & Tinney 2020; Zhao et al. 2022): Fourier phase-spectrum decomposition of the CCF"
  - "Line-by-line RVs with activity-sensitivity line selection (Dumusque 2018; Cretignier et al. 2020; Artigau et al. 2022)"
  - "FF' method and multi-dimensional Gaussian-process activity model with indicators (Aigrain et al. 2012; Rajpaul et al. 2015)"
  - "Neural network on CCF residuals (de Beurs et al. 2022) and its vision-transformer / concatenated-CCF-vector successors"
  - "Doppler-constrained PCA / generalized PCA on spectra (Jones et al. 2022) and wobble-style data-driven templates (Bedell et al. 2019)"

literature:
  web: true                  # false: write cards from model memory, flagged as unverified
  max_tool_turns: 40
  allowed_domains: [arxiv.org, adsabs.harvard.edu, ui.adsabs.harvard.edu, iopscience.iop.org,
                    aanda.org, academic.oup.com, nature.com, science.org, mdpi.com,
                    link.springer.com, sciencedirect.com, spiedigitallibrary.org, zenodo.org,
                    semanticscholar.org, neid.psu.edu, noirlab.edu]
  topics:
    - "CCF-shape methods: SCALPELS, FIESTA, CCF PCA, bisector / skew-normal indicators"
    - "Line-by-line and line-selection methods; formation-depth / temperature-binned RVs; Zeeman-sensitive lines; pairwise GP on lines"
    - "Activity-indicator and Gaussian-process models: FF', multi-dimensional GPs, latent GP frameworks, pyaneti, S+LEAF"
    - "Machine learning on CCFs and spectra: CNNs, vision transformers on concatenated CCF vectors, autoencoders, AESTRA, representation learning"
    - "Pixel-level data-driven spectral models: wobble, Doppler-constrained PCA, ZLSD, YARARA post-processing, template-residual methods"
    - "Sun-as-a-star studies with HARPS-N, HARPS/HELIOS, NEID, EXPRES/LOST, KPF/SoCal: magnetic flux proxies, convective blueshift suppression, SDO-based RV reconstruction (for physical insight only)"
    - "Granulation, supergranulation and oscillation noise: observing strategies, kernels, limits; chromatic RV; differential extinction; telluric and instrumental systematics in solar feeds"
    - "Community comparisons and reviews: EXPRES Stellar Signals Project (Zhao et al. 2022), EPRV working group report (Crass et al. 2021), reviews by Hara & Ford 2023, Meunier 2021"
